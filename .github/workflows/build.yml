name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
      release:
        description: if this is a release build
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.id }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Everything runs on the SELF-HOSTED fleet (GitHub-hosted runners are
      # not available to this org): Linux legs on the x64 Linux runner via
      # Docker buildx + qemu, macOS on the arm64 Mac, Windows on the Windows
      # box. The matrix is trimmed to the targets tofa actually ships or
      # downloads at first boot; the full upstream arch list (arm32 flavors,
      # x86, mips, ppc64, s390x, macos-x64) remains available at 18.3.0 for
      # anything still pinned there.
      matrix:
        id:
          - linux-arm64
          - linux-x64
          - macos-arm64
          - windows-x64

        include:
          # When adding a new target, define a new id above

          #
          # Linux
          #

          # arm64 runs on the Mac runner: its Docker (colima) executes
          # linux/arm64 NATIVELY on Apple silicon. On the x64 Linux runner the
          # same leg runs under qemu user emulation, which took hours for a
          # PostgreSQL compile even before the runner's playback-protecting
          # CPU caps. musl legs were dropped outright: tofa ships only gnu
          # x64/arm64 and nothing downloads the musl assets.
          - id: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: [self-hosted, macOS, ARM64]
            platform: linux/arm64/v8
            architecture: "AArch64"

          - id: linux-x64
            target: x86_64-unknown-linux-gnu
            runner: [self-hosted, Linux, X64]
            platform: linux/amd64
            architecture: "Advanced Micro Devices X86-64"

          #
          # MacOS
          #

          - id: macos-arm64
            target: aarch64-apple-darwin
            runner: [self-hosted, macOS, ARM64]
            architecture: "arm64"

          #
          # Windows
          #

          - id: windows-x64
            target: x86_64-pc-windows-msvc
            runner: [self-hosted, Windows, X64]
            architecture: "x86-64"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup environment
        run: |
          version=$(echo "${{ github.ref_name }}" | grep '^[0-9]*.[0-9]*.[0-9]*$') || true

          if [ -z "$version" ]; then
            # Set default version for non-release builds
            version="18.3.0"
          fi

          root_directory="$(pwd)"
          archive="postgresql-$version-${{ matrix.target }}"
          install_directory="$root_directory/$archive"

          echo "ARCHIVE=$archive" | tee -a $GITHUB_ENV
          echo "INSTALL_DIRECTORY=$install_directory" | tee -a $GITHUB_ENV
          echo "ROOT_DIRECTORY=$root_directory" | tee -a $GITHUB_ENV
          echo "VERSION=$version" | tee -a $GITHUB_ENV

      #
      # Linux Build
      #

      - name: Install emulators and configure build (Linux)
        if: ${{ startsWith(matrix.id, 'linux-') }}
        run: |
          platform="${{ matrix.platform }}";
          
          docker run --privileged --rm tonistiigi/binfmt --install all
          
          if [[ "${{ matrix.id }}" = *musl* ]]; then
            echo "DOCKERFILE=dockerfiles/Dockerfile.linux-musl" | tee -a $GITHUB_ENV
          else
            echo "DOCKERFILE=dockerfiles/Dockerfile.linux-gnu" | tee -a $GITHUB_ENV
          fi
          
          echo "PLATFORM=$platform" | tee -a $GITHUB_ENV

      - name: Build (Linux)
        if: ${{ startsWith(matrix.id, 'linux-') }}
        run: |
          cp $DOCKERFILE Dockerfile
          docker buildx build --build-arg "POSTGRESQL_VERSION=$VERSION" --platform "$PLATFORM" --tag postgresql-build:latest .
          
          docker create --platform "$PLATFORM" --name pgbuild postgresql-build:latest
          docker cp pgbuild:/opt/postgresql $INSTALL_DIRECTORY
          docker rm -f pgbuild

      #
      # MacOS Build
      #

      - name: Checkout postgresql source code (MacOS)
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: |
          source_directory="$ROOT_DIRECTORY/postgresql-src"
          branch=$(echo "$VERSION" | awk -F. '{print "REL_"$1"_"$2}')
          git clone --depth 1 --branch $branch -c advice.detachedHead=false https://git.postgresql.org/git/postgresql.git "$source_directory"
          echo "SOURCE_DIRECTORY=$source_directory" | tee -a $GITHUB_ENV

      - name: Build (MacOS)
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: |
          cd "$SOURCE_DIRECTORY"
          major_version=$(echo "$POSTGRESQL_VERSION" | awk -F. '{print $1}')
          
          # No Homebrew inputs at all: no ICU/LLVM/plpython (the shipped
          # 18.3.0 asset carried none of them) and, since 18.6.1, no OpenSSL
          # either — nothing tofa runs needs it inside PostgreSQL (pg_trgm
          # only, built-in SCRAM SHA-256, plain pg_dump, sqlx clients), and
          # dropping it removes the last third-party BINARY from this leg
          # (relocate_macos.py previously bundled Homebrew's libssl bottle).
          # libxml/xslt and readline bind macOS system libraries.
          ./configure $build_directory \
            --prefix "$INSTALL_DIRECTORY" \
            --enable-integer-datetimes \
            --enable-option-checking=fatal \
            $([ $major_version -le 16 ] && echo "--enable-thread-safety") \
            --without-icu \
            --without-ldap \
            --with-libxml \
            --with-libxslt \
            --with-pgport=5432 \
            --with-readline \
            --with-system-tzdata=/usr/share/zoneinfo \
            --with-uuid=e2fs
          make $([ $major_version -ge 15 ] && echo "world-bin")
          make $([ $major_version -ge 15 ] && echo "install-world-bin" || echo "install")
          make -C contrib install

          cp "$SOURCE_DIRECTORY/COPYRIGHT" "$INSTALL_DIRECTORY"
          cd "$ROOT_DIRECTORY"

      # Make the MacOS build relocatable AND self-contained. The old fix-up
      # only rewrote bin/* references to libpq: the built dylibs kept the
      # runner's absolute path in their install names and cross-references,
      # and everything kept linking Homebrew's openssl@3 by absolute path —
      # so a machine without Homebrew's openssl could not start the server at
      # all, and hardened-runtime consumers rejected the Homebrew dylibs
      # (different Team IDs). The script copies every non-system dependency
      # into lib/, rewrites all references (@executable_path/../lib from
      # bin/, @loader_path from lib/) to a fixpoint, re-signs ad hoc
      # (mandatory on arm64 after install_name_tool), and FAILS the build if
      # any absolute non-system reference remains.
      - name: Make install relocatable and self-contained (MacOS)
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: |
          python3 scripts/relocate_macos.py "$INSTALL_DIRECTORY"

      #
      # Windows
      #

      # Built from source like every other platform — Windows used to
      # repackage EnterpriseDB's pre-built binaries, downloaded with no
      # signature or checksum verification: a supply-chain hole. The runner
      # carries MSVC Build Tools, machine-wide Python 3.12 + meson,
      # Strawberry Perl, and winflexbison (C:\tools\winflexbison).
      #
      # -Dssl=none everywhere: nothing tofa runs needs OpenSSL inside
      # PostgreSQL (only pg_trgm is used, SCRAM uses the built-in SHA-256,
      # backups are plain pg_dump gzipped by tofa itself, clients connect
      # via sqlx over loopback). The result depends only on Windows system
      # DLLs plus VCRUNTIME140 (covered by the bundled, Authenticode-verified
      # VC++ redist).
      - name: Build from source (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $branch = "REL_" + ($env:VERSION -replace '^(\d+)\.(\d+).*','$1_$2')
          git clone --depth 1 --branch $branch -c advice.detachedHead=false https://git.postgresql.org/git/postgresql.git pgsrc
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsroot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = "$vsroot\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found under $vsroot" }
          $env:Path = "C:\tools\winflexbison;" + $env:Path
          # INSTALL_DIRECTORY from the bash setup step is a /c/... path; use
          # the native form for meson.
          $prefix = Join-Path $env:GITHUB_WORKSPACE $env:ARCHIVE
          $py = "C:\Program Files\Python312\python.exe"
          # CC=cl: keep Strawberry's ccache shim out of the build (its cache
          # dir lives in a user profile the runner service does not have).
          cmd /c "call `"$vcvars`" >nul 2>&1 && set CC=cl&& cd /d pgsrc && `"$py`" -m mesonbuild.mesonmain setup build --prefix=`"$prefix`" -Dssl=none -Dicu=disabled -Dnls=disabled -Dplperl=disabled -Dplpython=disabled -Dpltcl=disabled -Dldap=disabled -Dzstd=disabled -Dlz4=disabled -Dlibxml=disabled -Dlibxslt=disabled -Duuid=none && `"$py`" -m mesonbuild.mesonmain compile -C build && `"$py`" -m mesonbuild.mesonmain install -C build --quiet"
          if ($LASTEXITCODE -ne 0) { throw "meson build failed ($LASTEXITCODE)" }
          if (-not (Test-Path "$prefix\bin\postgres.exe")) { throw "postgres.exe missing after install" }

      #
      # Package
      #

      - name: Prepare archive
        run: |
          cp $ROOT_DIRECTORY/{README.md,LICENSE} "$INSTALL_DIRECTORY"
          ls -l "$INSTALL_DIRECTORY/"

      # The .tar.gz archive is the primary archive for all platforms.  This archive
      # provides a consistent experience for programmatic cases (e.g. embedded).
      - name: Build archive (Linux, MacOS)
        if: ${{ !startsWith(matrix.id, 'windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          # macOS has shasum, minimal Linux hosts have sha256sum; take either
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          else
            sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          fi
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      - name: Build archive (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          certutil -hashfile "$ARCHIVE.tar.gz" SHA256 > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      # The zip archive for Windows is created as a convenience to users for manual installations.
      - name: Build .zip archive (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') }}
        run: |
          # System32 bsdtar -a picks the zip format from the extension; Git bash`s
          # GNU tar cannot write zip and 7z is not installed
          /c/Windows/System32/tar.exe -a -cf "$ARCHIVE.zip" "$ARCHIVE"
          certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.zip.sha256"
          echo "WINDOWS_ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
          echo "WINDOWS_ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV

      #
      # Test
      #

      - name: Test the binary file cpu architecture
        run: |
          postgres_file="$INSTALL_DIRECTORY/bin/postgres"
          
          if [[ "${{ matrix.id }}" = linux-* ]]; then
            # readelf runs in the build image: the mac runner hosts the arm64
            # linux leg and has no readelf of its own
            cpu_architecture=$(docker run --rm --platform "$PLATFORM" \
              --volume "$INSTALL_DIRECTORY":/opt/archtest postgresql-build:latest \
              readelf --file-header /opt/archtest/bin/postgres | grep 'Machine:')
          else
            cpu_architecture=$(file "$postgres_file")
          fi
          
          echo "CPU_ARCHITECTURE=$cpu_architecture" | tee -a $GITHUB_ENV
          
          if [[ "$cpu_architecture" != *"${{ matrix.architecture }}"* ]]; then
            echo "ERROR: CPU architecture ($cpu_architecture) does not match expected architecture (${{ matrix.architecture }})"
            exit 1
          fi

      - name: Test build / archive
        run: |
          test_directory=$(mktemp -d)
          tar xzf "$ARCHIVE.tar.gz" -C "$test_directory"
          cd "$test_directory/$ARCHIVE"
          cp "$ROOT_DIRECTORY/scripts/test.sh" .
          
          if [[ "${{ matrix.id }}" = macos* ]]; then
            echo "Testing MacOS"
            ./test.sh $VERSION
          elif [[ "${{ matrix.id }}" = windows* ]]; then
            echo "Testing Windows"
            ./test.sh $VERSION
          elif [[ "${{ matrix.id }}" = *musl* ]]; then
            echo "Testing Linux MUSL"
            docker run \
              --platform "$PLATFORM" \
              --tty \
              --volume $(pwd):/opt/test \
              postgresql-build:latest \
              /bin/sh -c "cd /opt/test && ls -l && ./test.sh $VERSION"
          else
            echo "Testing Linux GNU"
            docker run \
              --platform "$PLATFORM" \
              --tty \
              --volume $(pwd):/opt/test \
              postgresql-build:latest \
              /bin/sh -c "cd /opt/test && ls -l && ./test.sh $VERSION"
          fi

      #
      # Release
      #

      - name: Upload release archive
        if: ${{ inputs.release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --clobber: a retried leg must overwrite its own earlier upload
          gh release upload "$VERSION" --clobber ${{ env.ASSET }} ${{ env.ASSET_SUM }}

      - name: Upload release archive (Windows)
        if: ${{ inputs.release == true && startsWith(matrix.id, 'windows-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION" --clobber ${{ env.WINDOWS_ASSET }} ${{ env.WINDOWS_ASSET_SUM }}
