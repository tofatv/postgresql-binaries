name: upstream-watch

# PostgreSQL is this repo's real dependency, and it is not a Dependabot
# ecosystem: upstream minor releases (the ones that carry CVE fixes) land as
# REL_x_y tags on git.postgresql.org. This checks weekly whether a newer
# minor exists for any major we currently publish and FAILS the run (with the
# details in the step summary) so the bump does not depend on somebody
# remembering. No GitHub issues: they are disabled on this repo (the old
# issue-based version failed every week on that alone and reported nothing).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Compare published majors against upstream minors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the newest major we publish: that is the one tofa ships. Older
          # majors (16.x, 17.x releases) are kept for history, not maintained,
          # and would turn this check permanently red.
          majors=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --json tagName \
            -q '.[].tagName' | awk -F. '{print $1}' | sort -n | tail -1)
          [ -n "$majors" ] || { echo "no releases yet"; exit 0; }

          upstream=$(git ls-remote --tags https://git.postgresql.org/git/postgresql.git 'REL_*' \
            | awk '{print $2}' | grep -E 'REL_[0-9]+_[0-9]+$' | sed -E 's|.*REL_([0-9]+)_([0-9]+)$|\1.\2|')

          stale=""
          for major in $majors; do
            latest_upstream=$(echo "$upstream" | awk -F. -v M="$major" '$1==M {print $2}' | sort -n | tail -1)
            [ -n "$latest_upstream" ] || continue
            ours=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --json tagName \
              -q '.[].tagName' | awk -F. -v M="$major" '$1==M {print $2}' | sort -n | tail -1)
            if [ "$latest_upstream" -gt "$ours" ]; then
              stale="${stale}- PostgreSQL ${major}.${latest_upstream} is out upstream; our newest is ${major}.${ours} (tag a ${major}.${latest_upstream}.0 release to pick it up)\n"
            fi
          done

          if [ -n "$stale" ]; then
            {
              echo "## Upstream PostgreSQL minor releases available"
              echo
              printf "%b" "$stale"
              echo
              echo "Minor releases are drop-in for existing clusters of the same major."
            } >> "$GITHUB_STEP_SUMMARY"
            printf "%b" "$stale" | sed 's/^- /::error::/'
            exit 1
          fi
          echo "All published majors are on the latest upstream minor."
